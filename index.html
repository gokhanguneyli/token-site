<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$CPZ - King of the BNB Jungle</title>
  <link href="https://fonts.googleapis.com/css2?family=Impact&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #06110C;
      --card-bg: rgba(17, 40, 32, 0.88);
      --bnb-yellow: #F3BA2F;
      --neon-green: #00FF66;
      --text-light: #F0F0F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      /* Zengin Orman Arka Planı (HD Jungle Layer) */
      background-image: 
        linear-gradient(180deg, rgba(6, 17, 12, 0.75) 0%, rgba(6, 17, 12, 0.85) 100%),
        url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-light);
      font-family: 'Outfit', sans-serif;
      line-height: 1.6;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Moving Jungle Fireflies & Dust Particles */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 102, 0.2), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(243, 186, 47, 0.15), transparent 35%);
      pointer-events: none;
      z-index: 0;
      animation: pulseBg 4s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* Animated Jungle Vines */
    .vine-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .vine {
      position: absolute;
      top: -20px;
      width: 6px;
      height: 300px;
      background: linear-gradient(180deg, #1A4D38, #00FF66);
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0,255,102,0.6);
      transform-origin: top center;
      animation: swingVine 4s ease-in-out infinite alternate;
    }

    .vine::after {
      content: "🌿";
      position: absolute;
      bottom: -15px;
      left: -9px;
      font-size: 22px;
    }

    .vine-1 { left: 4%; animation-duration: 3.5s; }
    .vine-2 { left: 14%; height: 210px; animation-duration: 4.8s; animation-delay: -1s; }
    .vine-3 { right: 14%; height: 230px; animation-duration: 4.2s; animation-delay: -2s; }
    .vine-4 { right: 4%; animation-duration: 3.8s; animation-delay: -0.5s; }

    @keyframes swingVine {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(10deg); }
    }

    /* Animated Chimp Clan & Animals in Background */
    .jungle-creature {
      position: fixed;
      font-size: 40px;
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 0 10px rgba(0,255,102,0.4));
    }

    .chimp-left {
      left: 2%;
      bottom: 15%;
      animation: bounceChimp 3s ease-in-out infinite alternate;
    }

    .chimp-right {
      right: 2%;
      bottom: 25%;
      animation: swingChimp 4s ease-in-out infinite alternate;
    }

    .chimp-top {
      right: 12%;
      top: 10%;
      animation: peekChimp 5s ease-in-out infinite alternate;
    }

    @keyframes bounceChimp {
      0% { transform: translateY(0) rotate(-5deg); }
      100% { transform: translateY(-20px) rotate(5deg); }
    }

    @keyframes swingChimp {
      0% { transform: rotate(-15deg) scale(1); }
      100% { transform: rotate(15deg) scale(1.1); }
    }

    @keyframes peekChimp {
      0% { transform: translateX(0); }
      100% { transform: translateX(-15px); }
    }

    /* Glowing Tropical Flowers */
    .flower {
      position: fixed;
      font-size: 28px;
      pointer-events: none;
      z-index: 1;
      animation: flowerGlow 2.5s ease-in-out infinite alternate;
    }

    .flower-1 { left: 8%; bottom: 5%; }
    .flower-2 { right: 8%; bottom: 8%; animation-delay: 1s; }

    @keyframes flowerGlow {
      0% { transform: scale(0.9); filter: drop-shadow(0 0 5px var(--bnb-yellow)); }
      100% { transform: scale(1.15); filter: drop-shadow(0 0 15px var(--neon-green)); }
    }

    /* Falling Leaves Effect */
    .leaf-particle {
      position: fixed;
      top: -20px;
      font-size: 20px;
      pointer-events: none;
      z-index: 1;
      animation: fallLeaf 8s linear infinite;
    }

    .leaf-1 { left: 10%; animation-duration: 7s; }
    .leaf-2 { left: 35%; animation-duration: 9s; animation-delay: 2s; }
    .leaf-3 { left: 65%; animation-duration: 6.5s; animation-delay: 1s; }
    .leaf-4 { left: 88%; animation-duration: 8.5s; animation-delay: 3s; }

    @keyframes fallLeaf {
      0% { top: -20px; transform: translateX(0) rotate(0deg); opacity: 0.9; }
      100% { top: 105vh; transform: translateX(90px) rotate(360deg); opacity: 0.2; }
    }

    /* Main Container */
    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Header */
    header {
      text-align: center;
      margin: 40px 0;
    }

    h1.hero-title {
      font-family: 'Impact', sans-serif;
      font-size: 3.8rem;
      color: var(--bnb-yellow);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(243, 186, 47, 0.6);
      animation: neonPulse 2s ease-in-out infinite alternate;
    }

    @keyframes neonPulse {
      0% { text-shadow: 0 0 15px rgba(243, 186, 47, 0.4); }
      100% { text-shadow: 0 0 25px rgba(0, 255, 102, 0.8), 0 0 10px rgba(243, 186, 47, 0.9); }
    }

    p.hero-subtitle {
      font-size: 1.3rem;
      color: var(--neon-green);
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Cards with Backdrop Filter */
    .comic-card {
      background-color: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 3px solid var(--bnb-yellow);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .glow-title {
      font-family: 'Impact', sans-serif;
      font-size: 2.2rem;
      color: var(--bnb-yellow);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1.5px;
    }

    /* Comic Image Wrapper */
    .comic-img-wrapper {
      width: 100%;
      text-align: center;
      overflow: hidden;
      border-radius: 12px;
    }

    .comic-img-wrapper img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    /* Tokenomics Grid */
    .tokenomics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .token-box {
      background: rgba(0, 0, 0, 0.5);
      padding: 18px 10px;
      border-radius: 12px;
      border-left: 4px solid var(--neon-green);
      transition: transform 0.3s ease;
    }

    .token-box:hover {
      transform: translateY(-5px);
      border-left-color: var(--bnb-yellow);
    }

    .token-box h3 {
      color: var(--neon-green);
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .token-box p {
      font-family: 'Impact', sans-serif;
      font-size: 1.6rem;
      color: var(--bnb-yellow);
    }

    /* Action Buttons */
    .social-section {
      text-align: center;
      margin: 40px 0;
    }

    .btn-action {
      display: inline-block;
      background-color: var(--bnb-yellow);
      color: #000;
      font-family: 'Impact', sans-serif;
      font-size: 1.4rem;
      padding: 14px 35px;
      margin: 10px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(243, 186, 47, 0.4);
      animation: btnGlow 2s infinite alternate;
    }

    @keyframes btnGlow {
      0% { box-shadow: 0 0 10px rgba(243, 186, 47, 0.4); }
      100% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.7); }
    }

    .btn-action:hover {
      transform: scale(1.08);
      background-color: var(--neon-green);
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>

  <!-- Animated Jungle Vines -->
  <div class="vine-container">
    <div class="vine vine-1"></div>
    <div class="vine vine-2"></div>
    <div class="vine vine-3"></div>

  </div>

  <!-- Animated Chimp Clan & Tropical Animals -->
  <div class="jungle-creature chimp-left">🐒</div>

  <!-- Animated Glowing Flowers -->
  <div class="flower flower-1">🌺</div>

  <div class="leaf-particle leaf-1">🍃</div>

    <!-- Socials & Buy Section -->

  </div>

</body>
</html>
