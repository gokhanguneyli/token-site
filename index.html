  <style>
    :root {
      --bg-dark: #0B0E11;
      --card-bg: rgba(18, 20, 26, 0.85);
      --card-border: rgba(240, 185, 11, 0.4);
      --accent-bnb: #F0B90B;
      --accent-hover: #FCD535;
      --text-main: #FFFFFF;
      --text-muted: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;

    /* 1. CINEMATIC INTRO OVERLAY WITH LOGO2.PNG */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background-color: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #intro-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #intro-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .intro-content {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(11, 14, 17, 0.7);
      padding: 30px 40px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-mascot {
      width: 180px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 15px rgba(240, 185, 11, 0.6));
      animation: floatMascot 3s ease-in-out infinite;
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .intro-btn {
      background-color: var(--accent-bnb);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 800;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 30px rgba(240, 185, 11, 0.6);
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .intro-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(240, 185, 11, 0.9);
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      background: rgba(11, 14, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-bnb);
      text-decoration: none;
