  <style>
    :root {
      --bg-dark: #0B0E11;
      --card-bg: rgba(18, 20, 26, 0.85);

      --accent-bnb: #F0B90B;

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* INTRO SCREEN */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      overflow: hidden;
    }

    #intro-screen.hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #intro-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(1.1) contrast(1.05);
      transform: scale(1);
      transform-origin: center center;
    }

    .intro-video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(0,0,0,0.1) 30%, rgba(0, 0, 0, 0.6) 90%);
    }

    .intro-content {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(11, 14, 17, 0.85);
      padding: 30px 40px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 0 60px rgba(0,0,0,0.9);
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-mascot {
      width: 160px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 20px rgba(240, 185, 11, 0.8));
      animation: floatMascot 3s ease-in-out infinite;
    }

      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
