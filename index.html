<script>
    function enterSite() {
      var intro = document.getElementById('intro-screen');
      var introVideo = document.getElementById('intro-video');
      
      if (introVideo) {
        try {
          introVideo.pause();
        } catch(e){}
      }
      
      if (intro) {
        intro.classList.add('hidden');
      }
    }

    // Video oynatımı bittiğinde otomatik olarak siteye giriş yap
    document.addEventListener("DOMContentLoaded", function() {
      var introVideo = document.getElementById('intro-video');
      if (introVideo) {
        // Otomatik geçiş için videonun döngüsünü (loop) kaldırıyoruz
        introVideo.removeAttribute('loop');
        
        // Video bittiği an enterSite fonksiyonunu çalıştırır
        introVideo.addEventListener('ended', function() {
          enterSite();
        });
      }
    });

    function copyContract() {
      var address = document.getElementById('contract').innerText;
      navigator.clipboard.writeText(address);
      alert('Contract address copied to clipboard!');
    }
  </script>
