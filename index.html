<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$CPZ - ChangpengZee | The Best Meme Coin on Earth</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0B0E11;
      --card-bg: rgba(18, 20, 26, 0.85);
      --card-border: rgba(240, 185, 11, 0.4);
      --accent-bnb: #F0B90B;
      --accent-hover: #FCD535;
      --text-main: #FFFFFF;
      --text-muted: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      overflow-x: hidden;
    }

    h1, h2, h3 {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* INTRO SCREEN */
    #intro-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease, visibility 0.6s ease;
      overflow: hidden;
    }

    #intro-screen.hidden {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    #intro-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: brightness(1.3) contrast(1.15) blur(1px);
      transform: scale(1.18);
      transform-origin: center center;
    }

    .intro-video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(0,0,0,0.1) 30%, rgba(0, 0, 0, 0.6) 90%);
    }

    .intro-content {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(11, 14, 17, 0.85);
      padding: 30px 40px;
      border-radius: 24px;
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      box-shadow: 0 0 60px rgba(0,0,0,0.9);
      max-width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .intro-mascot {
      width: 160px;
      height: auto;
      margin-bottom: 15px;
      filter: drop-shadow(0 0 20px rgba(240, 185, 11, 0.8));
      animation: floatMascot 3s ease-in-out infinite;
    }

    @keyframes floatMascot {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .intro-btn {
      background-color: var(--accent-bnb);
      color: #000;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 800;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 30px rgba(240, 185, 11, 0.6);
      transition: all 0.3s ease;
      margin-top: 15px;
    }

    .intro-btn:hover {
      background-color: var(--accent-hover);
      transform: scale(1.05);
      box-shadow: 0 0 50px rgba(240, 185, 11, 0.9);
    }

    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      background: rgba(11, 14, 17, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      color: var(--accent-bnb);
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent-bnb);
    }

    .btn {
      background-color: var(--accent-bnb);
      color: #000;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(240, 185, 11, 0.5);
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 100px 20px 60px;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-logo-wrapper {
      position: relative;
      display: inline-block;
      margin-bottom: 32px;
      padding: 6px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #F0B90B, transparent 60%, #F0B90B);
      animation: rotateGlow 3s linear infinite;
      box-shadow: 0 0 40px rgba(240, 185, 11, 0.6);
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .hero-logo-inner {
      border-radius: 50%;
      overflow: hidden;
      background: #000;
      display: block;
    }

    .hero-logo {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
    }

    .hero h1 {
      font-size: 56px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 16px;
      color: #FFF;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
    }

    .hero h1 span {
      color: var(--accent-bnb);
    }

    .hero p {
      color: #FFF;
      font-size: 20px;
      max-width: 650px;
      margin: 0 auto 36px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      font-weight: 600;
    }

    /* CONTRACT BOX */
    .contract-box {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 24px;
      max-width: 620px;
      margin: 0 auto 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }

    .contract-details {
      text-align: left;
    }

    .contract-label {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .contract-address {
      font-family: monospace;
      font-size: 15px;
      color: var(--accent-bnb);
      word-break: break-all;
      font-weight: 700;
    }

    /* CONTENT SECTIONS & GRID */
    .section-container {
      padding: 60px 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      font-size: 38px;
      margin-bottom: 48px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.9);
    }

    .section-title span {
      color: var(--accent-bnb);
    }

    /* MANIFESTO / PEPE STYLE MANIFESTO BOX */
    .manifesto-box {
      background: linear-gradient(135deg, rgba(240, 185, 11, 0.15) 0%, rgba(18, 20, 26, 0.95) 100%);
      border: 2px solid var(--accent-bnb);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      margin-bottom: 60px;
      box-shadow: 0 0 50px rgba(240, 185, 11, 0.2);
    }

    .manifesto-box h3 {
      font-size: 32px;
      color: var(--accent-bnb);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .manifesto-box p {
      font-size: 18px;
      color: #FFF;
      line-height: 1.8;
      max-width: 850px;
      margin: 0 auto 16px;
      font-weight: 500;
    }

    .manifesto-highlight {
      font-size: 22px !important;
      font-weight: 800 !important;
      color: var(--accent-bnb) !important;
      text-shadow: 0 0 10px rgba(240, 185, 11, 0.5);
    }

    /* TWO COLUMN LAYOUT FOR TOKENOMICS & ABOUT */
    .split-layout {
      display: flex;
      align-items: center;
      gap: 40px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
