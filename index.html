<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>$CPZ - King of the BNB Jungle</title>
  <link href="https://fonts.googleapis.com/css2?family=Impact&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08140F;
      --card-bg: #112820;
      --bnb-yellow: #F3BA2F;
      --neon-green: #00FF66;
      --text-light: #F0F0F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Outfit', sans-serif;
      line-height: 1.6;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    /* Moving Jungle Particles Background */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 20% 30%, rgba(0, 255, 102, 0.15), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(243, 186, 47, 0.1), transparent 40%);
      pointer-events: none;
      z-index: 0;
      animation: pulseBg 6s ease-in-out infinite alternate;
    }

    @keyframes pulseBg {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* Swinging Vine Animations */
    .vine-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .vine {
      position: absolute;
      top: -20px;
      width: 8px;
      height: 280px;
      background: linear-gradient(180deg, #1A4D38, #00FF66);
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,255,102,0.5);
      transform-origin: top center;
      animation: swingVine 4s ease-in-out infinite alternate;
    }

    .vine::after {
      content: "🌿";
      position: absolute;
      bottom: -15px;
      left: -8px;
      font-size: 20px;
    }

    .vine-1 { left: 5%; animation-duration: 3.5s; }
    .vine-2 { left: 15%; height: 200px; animation-duration: 4.5s; animation-delay: -1s; }
    .vine-3 { right: 15%; height: 220px; animation-duration: 4s; animation-delay: -2s; }
    .vine-4 { right: 5%; animation-duration: 3.8s; animation-delay: -0.5s; }

    @keyframes swingVine {
      0% { transform: rotate(-8deg); }
      100% { transform: rotate(8deg); }
    }

    /* Falling Leaves Effect */
    .leaf-particle {
      position: fixed;
      top: -20px;
      font-size: 18px;
      pointer-events: none;
      z-index: 1;
      animation: fallLeaf 8s linear infinite;
    }

    .leaf-1 { left: 10%; animation-duration: 7s; animation-delay: 0s; }
    .leaf-2 { left: 40%; animation-duration: 9s; animation-delay: 3s; }
    .leaf-3 { left: 70%; animation-duration: 6s; animation-delay: 1.5s; }
    .leaf-4 { left: 90%; animation-duration: 8s; animation-delay: 4s; }

    @keyframes fallLeaf {
      0% {
        top: -20px;
        transform: translateX(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        top: 105vh;
        transform: translateX(80px) rotate(360deg);
        opacity: 0.2;
      }
    }

    /* Container Structure */
    .container {
      max-width: 900px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    /* Header */
    header {
      text-align: center;
      margin: 40px 0;
    }

    h1.hero-title {
      font-family: 'Impact', sans-serif;
      font-size: 3.8rem;
      color: var(--bnb-yellow);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(243, 186, 47, 0.6);
      animation: neonPulse 2s ease-in-out infinite alternate;
    }

    @keyframes neonPulse {
      0% { text-shadow: 0 0 15px rgba(243, 186, 47, 0.4); }
      100% { text-shadow: 0 0 25px rgba(0, 255, 102, 0.8), 0 0 10px rgba(243, 186, 47, 0.9); }
    }

    p.hero-subtitle {
      font-size: 1.3rem;
      color: var(--neon-green);
      font-weight: 700;
      margin-top: 10px;
      letter-spacing: 1px;
    }

    /* Cards */
    .comic-card {
      background-color: var(--card-bg);
      border: 3px solid var(--bnb-yellow);
      border-radius: 16px;
      padding: 25px;
      margin-bottom: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .glow-title {
      font-family: 'Impact', sans-serif;
      font-size: 2.2rem;
      color: var(--bnb-yellow);
      text-align: center;
      margin-bottom: 20px;
      letter-spacing: 1.5px;
    }

    /* Comic Image Wrapper */
    .comic-img-wrapper {
      width: 100%;
      text-align: center;
      overflow: hidden;
      border-radius: 12px;
    }

    .comic-img-wrapper img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 2px solid var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    /* Tokenomics Grid */
    .tokenomics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      text-align: center;
      margin-top: 20px;
    }

    .token-box {
      background: rgba(0, 0, 0, 0.4);
      padding: 18px 10px;
      border-radius: 12px;
      border-left: 4px solid var(--neon-green);
      transition: transform 0.3s ease;
    }

    .token-box:hover {
      transform: translateY(-5px);
      border-left-color: var(--bnb-yellow);
    }

    .token-box h3 {
      color: var(--neon-green);
      font-size: 1rem;
      margin-bottom: 5px;
    }

    .token-box p {
      font-family: 'Impact', sans-serif;
      font-size: 1.6rem;
      color: var(--bnb-yellow);
    }

    /* Action Buttons */
    .social-section {
      text-align: center;
      margin: 40px 0;
    }

    .btn-action {
      display: inline-block;
      background-color: var(--bnb-yellow);
      color: #000;
      font-family: 'Impact', sans-serif;
      font-size: 1.4rem;
      padding: 14px 35px;
      margin: 10px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(243, 186, 47, 0.4);
      animation: btnGlow 2s infinite alternate;
    }

    @keyframes btnGlow {
      0% { box-shadow: 0 0 10px rgba(243, 186, 47, 0.4); }
      100% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.7); }
    }

    .btn-action:hover {
      transform: scale(1.08);
      background-color: var(--neon-green);
    }

    footer {
      text-align: center;
      margin-top: 50px;
      font-size: 0.9rem;
      color: #777;
    }
  </style>
</head>
<body>

  <!-- Animated Jungle Elements -->
  <div class="vine-container">
    <div class="vine vine-1"></div>
    <div class="vine vine-2"></div>
    <div class="vine vine-3"></div>
    <div class="vine vine-4"></div>
  </div>

  <div class="leaf-particle leaf-1">🍃</div>
  <div class="leaf-particle leaf-2">🌿</div>
  <div class="leaf-particle leaf-3">🍃</div>
  <div class="leaf-particle leaf-4">🌱</div>

  <div class="container">
    
    <!-- Hero Header -->
    <header>
      <h1 class="hero-title">$CPZ TOKEN</h1>
      <p class="hero-subtitle">THE REAL KING OF THE BNB JUNGLE</p>
    </header>

    <!-- Comic Narrative Section -->
    <div class="comic-card">
      <h2 class="glow-title">THE JUNGLE STORY</h2>
      <div class="comic-img-wrapper">
        <img src="comic-panel.png" alt="$CPZ Jungle Comic Narrative" />
      </div>
    </div>

    <!-- Tokenomics Section -->
    <div class="comic-card">
      <h2 class="glow-title">TOKENOMICS</h2>
      <div class="tokenomics-grid">
        <div class="token-box">
          <h3>TOTAL SUPPLY</h3>
          <p>1,000,000,000</p>
        </div>
        <div class="token-box">
          <h3>TAX</h3>
          <p>0% / 0%</p>
        </div>
        <div class="token-box">
          <h3>LAUNCH</h3>
          <p>FOUR.MEME</p>
        </div>
        <div class="token-box">
          <h3>MIGRATION</h3>
          <p>PANCAKESWAP</p>
        </div>
      </div>
    </div>

    <!-- Socials & Buy Section -->
    <div class="social-section">
      <a href="https://four.meme" target="_blank" class="btn-action">BUY ON FOUR.MEME</a>
      <a href="https://t.me/" target="_blank" class="btn-action">TELEGRAM</a>
      <a href="https://x.com/" target="_blank" class="btn-action">TWITTER / X</a>
    </div>

    <footer>
      <p>© 2026 $CPZ Project. All rights reserved.</p>
    </footer>

  </div>

</body>
</html>
